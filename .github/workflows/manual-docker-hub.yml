name: Manual Build and Push to Docker Hub

on:
  workflow_dispatch:  # 仅允许在网页上手动点击触发，绝不自动运行
    inputs:
      image_name:
        description: 'Docker Hub 镜像名称（无需加用户名，例如: my-app）'
        required: true
        default: 'my-image'
      image_tag:
        description: '镜像版本标签（例如: latest 或 v1.0）'
        required: true
        default: 'latest'
      platforms:
        description: '目标架构（一般选 linux/amd64 即可，编译最快）'
        required: true
        default: 'linux/amd64'
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}:${{ inputs.image_tag }}
